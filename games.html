<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>
    <link rel="icon" type="image/png" href="icon.jpg">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            text-align: center;
            color: white;
        }

        .container { margin-top: 50px; }
        h1 { font-size: 40px; margin-bottom: 20px; }

        .buttons button {
            font-size: 20px;
            padding: 15px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            background-color: white;
            color: #333;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .buttons button:hover {
            transform: scale(1.1);
            background-color: #f1f1f1;
        }

        #result {
            font-size: 22px;
            margin-top: 20px;
            min-height: 40px;
            transition: all 0.3s ease;
        }

        .scoreboard {
            margin-top: 30px;
            font-size: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            margin: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .highlight-win { animation: winAnim 0.5s; }
        .highlight-lose { animation: loseAnim 0.5s; }

        @keyframes winAnim {
            0% { transform: scale(1); background-color: rgba(0,255,0,0.2);}
            50% { transform: scale(1.1);}
            100% { transform: scale(1); background-color: rgba(0,0,0,0);}
        }
        @keyframes loseAnim {
            0% { transform: scale(1); background-color: rgba(255,0,0,0.2);}
            50% { transform: scale(1.1);}
            100% { transform: scale(1); background-color: rgba(0,0,0,0);}
        }

        .moves { font-size: 60px; margin-top: 20px; }

        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: white;
            color: #333;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .reset-btn:hover { transform: scale(1.05); background-color: #f1f1f1; }

        /* Result image */
        #resultImage {
            width: 150px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Rock Paper Scissors 🎮</h1>

        <div class="buttons">
            <button onclick="play('rock')">🪨 Rock</button>
            <button onclick="play('paper')">📄 Paper</button>
            <button onclick="play('scissors')">✂️ Scissors</button>
        </div>

        <div class="moves" id="moves">❓ vs ❓</div>

        <!-- Result image -->
        <img id="resultImage" src="" alt="">

        <p id="result">Choose your move!</p>

        <div class="scoreboard">
            <p>You: <span id="playerScore">0</span></p>
            <p>Computer: <span id="computerScore">0</span></p>
        </div>

        <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>
    </div>
</div>

<script>
    let playerScore = 0;
    let computerScore = 0;

    function play(userChoice) {
        const choices = ["rock", "paper", "scissors"];
        const emojis = {rock: "🪨", paper: "📄", scissors: "✂️"};
        const computerChoice = choices[Math.floor(Math.random() * 3)];
        const card = document.querySelector('.card');
        const resultImg = document.getElementById("resultImage");

        // Show moves
        document.getElementById("moves").textContent = `${emojis[userChoice]} vs ${emojis[computerChoice]}`;

        let resultText = "";

        if (userChoice === computerChoice) {
            resultText = "It's a Draw! 😐";
            card.className = 'card';
            resultImg.src = "draww.jpg"; // <-- put your own draw image here
        } else if (
            (userChoice === "rock" && computerChoice === "scissors") ||
            (userChoice === "paper" && computerChoice === "rock") ||
            (userChoice === "scissors" && computerChoice === "paper")
        ) {
            resultText = "You Win! 🎉";
            playerScore++;
            card.className = 'card highlight-win';
            resultImg.src = "winn.jpg"; // <-- put your own win image here
        } else {
            resultText = "You Lose! 😢";
            computerScore++;
            card.className = 'card highlight-lose';
            resultImg.src = "losee.jpg"; // <-- put your own lose image here
        }

        document.getElementById("result").textContent =
            "Computer chose " + computerChoice + ". " + resultText;

        document.getElementById("playerScore").textContent = playerScore;
        document.getElementById("computerScore").textContent = computerScore;
    }

    function resetGame() {
        playerScore = 0;
        computerScore = 0;
        document.getElementById("playerScore").textContent = playerScore;
        document.getElementById("computerScore").textContent = computerScore;
        document.getElementById("result").textContent = "Choose your move!";
        document.getElementById("moves").textContent = "❓ vs ❓";
        document.getElementById("resultImage").src = ""; // clears the image
        document.querySelector('.card').className = 'card';
    }
</script>

</body>
</html>
